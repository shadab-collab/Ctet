<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CTET Quiz</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<h2 class="appTitle">
CTET Quiz
</h2>


<div id="todayTopic">
Loading Quiz...
</div>



<!-- Start Page -->

<div id="startPage" class="card">


<h3>
Enter Your Name
</h3>


<input
id="studentName"
placeholder="Enter Your Name"
autocomplete="off">


<button onclick="startQuiz()">
Start Quiz
</button>


</div>





<!-- Quiz Page -->

<div id="quizPage" style="display:none;">



<!-- Header -->

<div id="quizHeader">


<div>
Score :
<span id="score">
0
</span>
</div>


<div id="progress">
Question 1 / 1
</div>


</div>





<!-- Question -->

<div id="questionBox" class="card">


<h3 id="questionHindi">

</h3>


<p id="questionEnglish">

</p>


</div>





<!-- Options -->


<div id="optionsBox">


<button id="aBtn" onclick="checkAnswer(0)">
</button>


<button id="bBtn" onclick="checkAnswer(1)">
</button>


<button id="cBtn" onclick="checkAnswer(2)">
</button>


<button id="dBtn" onclick="checkAnswer(3)">
</button>


</div>





<!-- Next Button -->


<button
id="nextBtn"
onclick="nextQuestion()"
style="display:none;">

Next Question

</button>




</div>








<!-- Result Page -->


<div id="resultPage" style="display:none;" class="card">


<h2>
Quiz Finished
</h2>



<h3 id="finalScore">

</h3>



<h3>
Leaderboard
</h3>


<div id="leaderboard">

</div>



</div>





</div>





<audio
id="correctSound"
src="correct.mp3">
</audio>


<audio
id="wrongSound"
src="wrong.mp3">
</audio>



<script src="student.js"></script>


</body>

</html>
