<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CTET Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header class="topBar">

<div class="logoBox">

<h2>CTET Quiz</h2>

<span id="todayTopic">
Loading Quiz...
</span>

</div>

</header>

<!-- START PAGE -->

<div id="startPage" class="card">

<h3>
Welcome
</h3>

<p class="subtitle">

Enter your name to begin today's quiz.

</p>

<input
id="studentName"
placeholder="Enter Your Name"
autocomplete="off">

<button onclick="startQuiz()">

Start Quiz

</button>

</div>

<!-- QUIZ PAGE -->

<div id="quizPage" style="display:none;">

<div id="quizHeader">

<div class="scoreBox">

<div class="label">

Score

</div>

<div id="score">

0

</div>

</div>

<div id="progress">

Question 1 / 10

</div>

</div>

<div id="questionBox" class="card">

<div class="questionTag">

QUESTION

</div>

<h3 id="questionHindi"></h3>

<p id="questionEnglish"></p>

</div>

<div id="optionsBox">

<button id="aBtn"
onclick="checkAnswer(0)"></button>

<button id="bBtn"
onclick="checkAnswer(1)"></button>

<button id="cBtn"
onclick="checkAnswer(2)"></button>

<button id="dBtn"
onclick="checkAnswer(3)"></button>

</div>

<button
id="nextBtn"
style="display:none"
onclick="nextQuestion()">

Next Question →

</button>

</div>
<!-- RESULT PAGE -->

<div
id="resultPage"
class="card"
style="display:none;">

<div class="resultIcon">

🏆

</div>

<h2>

Quiz Finished

</h2>

<h3 id="finalScore">

0 / 10

</h3>

<div class="resultSummary">

<div>

<span>

Score

</span>

<b id="scorePercent">

0%

</b>

</div>

<div>

<span>

Performance

</span>

<b id="performance">

Excellent

</b>

</div>

</div>

<h3 class="leaderTitle">

Leaderboard

</h3>

<div id="leaderboard">

</div>

<button
onclick="location.reload()">

Restart Quiz

</button>

</div>

</div>

<audio
id="correctSound"
src="correct.mp3">
</audio>

<audio
id="wrongSound"
src="wrong.mp3">
</audio>

<script src="student.js"></script>

</body>
</html>
