<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>CTET Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h2>CTET Quiz</h2>

<h3 id="todayTopic">Loading Quiz...</h3>

<div id="startPage">

<input
id="studentName"
placeholder="Enter Your Name"
autocomplete="off">

<br><br>

<button onclick="startQuiz()">

Start Quiz

</button>

</div>

<div
id="quizPage"
style="display:none;">

<h3>

Score :
<span id="score">0</span>

</h3>

<h3 id="progress">

Question 1 / 1

</h3>

<hr>

<h3 id="questionHindi"></h3>

<h4 id="questionEnglish"></h4>

<button
id="aBtn"
onclick="checkAnswer(0)">
</button>

<br><br>

<button
id="bBtn"
onclick="checkAnswer(1)">
</button>

<br><br>

<button
id="cBtn"
onclick="checkAnswer(2)">
</button>

<br><br>

<button
id="dBtn"
onclick="checkAnswer(3)">
</button>

<br><br>

<button
id="nextBtn"
onclick="nextQuestion()"
style="display:none;">

Next Question

</button>

</div>

<div
id="resultPage"
style="display:none;">

<h2>

Quiz Finished

</h2>

<h3 id="finalScore"></h3>

<h3>

Leaderboard

</h3>

<div id="leaderboard"></div>

</div>

<audio
id="correctSound"
src="correct.mp3"></audio>

<audio
id="wrongSound"
src="wrong.mp3"></audio>

<script src="student.js"></script>

</body>

</html>
