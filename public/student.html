<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CTET Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<!-- Header -->

<header class="header">

<div>

<h2 class="logo">

CTET Quiz

</h2>

<p id="todayTopic">

Loading Quiz...

</p>

</div>

</header>

<!-- Start Page -->

<section id="startPage" class="card">

<h2>

Welcome 👋

</h2>

<p>

Enter your name to begin today's quiz.

</p>

<input
id="studentName"
type="text"
placeholder="Enter Your Name"
autocomplete="off">

<button
class="primaryBtn"
onclick="startQuiz()">

Start Quiz

</button>

</section>

<!-- Quiz -->

<section
id="quizPage"
style="display:none;">

<div class="topInfo">

<div class="scoreCard">

<span>

Score

</span>

<h2 id="score">

0

</h2>

</div>

<div class="progressCard">

<div id="progress">

Question 1 / 10

</div>

</div>

</div>

<div
id="questionBox"
class="card">

<div class="badge">

QUESTION

</div>

<h3 id="questionHindi">

</h3>

<p id="questionEnglish">

</p>

</div>

<div id="optionsBox">

<button
id="aBtn"
onclick="checkAnswer(0)">
</button>

<button
id="bBtn"
onclick="checkAnswer(1)">
</button>

<button
id="cBtn"
onclick="checkAnswer(2)">
</button>

<button
id="dBtn"
onclick="checkAnswer(3)">
</button>

</div>

<button
id="nextBtn"
class="primaryBtn"
style="display:none;"
onclick="nextQuestion()">

Next →

</button>

</section>
<!-- RESULT PAGE -->

<section
id="resultPage"
class="card"
style="display:none;">

<div class="resultTop">

<div class="trophy">

🏆

</div>

<h2>

Quiz Completed

</h2>

<h3 id="finalScore">

0 / 10

</h3>

</div>

<div class="summary">

<div class="summaryCard">

<span>

Score

</span>

<b id="scorePercent">

0%

</b>

</div>

<div class="summaryCard">

<span>

Performance

</span>

<b id="performance">

Excellent

</b>

</div>

</div>

<h3 class="leaderboardTitle">

Leaderboard

</h3>

<div id="leaderboard">

</div>

<button
class="primaryBtn"
onclick="location.reload()">

Restart Quiz

</button>

</section>

</div>

<audio
id="correctSound"
src="correct.mp3">
</audio>

<audio
id="wrongSound"
src="wrong.mp3">
</audio>

<script src="student.js"></script>

</body>
</html>
